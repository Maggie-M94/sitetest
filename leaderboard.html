        <script>
document.addEventListener("DOMContentLoaded", function () {

    const bars = document.querySelectorAll(".leader-bar");

    // Get all leaderboard scores
    const scores = Array.from(bars).map(function(bar) {
        return Number(bar.dataset.score);
    });

    // Highest score becomes 100%
    const maxScore = Math.max(...scores);

    bars.forEach(function(bar) {

        const score = Number(bar.dataset.score);

        // Calculate width according to score
        const percentage = (score / maxScore) * 100;

        bar.style.width = percentage + "%";
    });

});
</script>
