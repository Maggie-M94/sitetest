<!DOCTYPE html>
<html lang="en">

        <meta name="description" content=""/>

        <!-- Bootstrap core CSS -->
        <link href="bootstrap_theme/bootstrap.css" rel="stylesheet" type="text/css">
        <!-- Custom styles for this template -->
        <link href="style.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://use.typekit.net/zir5zbu.css">
        <script>
        /* Pinegrow Interactions, do not remove */ (function(){try{if(!document.documentElement.hasAttribute('data-pg-ia-disabled')) { window.pgia_small_mq=typeof pgia_small_mq=='string'?pgia_small_mq:'(max-width:767px)';window.pgia_large_mq=typeof pgia_large_mq=='string'?pgia_large_mq:'(min-width:768px)';var style = document.createElement('style');var pgcss='html:not(.pg-ia-no-preview) [data-pg-ia-hide=""] {opacity:0;visibility:hidden;}html:not(.pg-ia-no-preview) [data-pg-ia-show=""] {opacity:1;visibility:visible;display:block;}';if(document.documentElement.hasAttribute('data-pg-id') && document.documentElement.hasAttribute('data-pg-mobile')) {pgia_small_mq='(min-width:0)';pgia_large_mq='(min-width:99999px)'} pgcss+='@media ' + pgia_small_mq + '{ html:not(.pg-ia-no-preview) [data-pg-ia-hide="mobile"] {opacity:0;visibility:hidden;}html:not(.pg-ia-no-preview) [data-pg-ia-show="mobile"] {opacity:1;visibility:visible;display:block;}}';pgcss+='@media ' + pgia_large_mq + '{html:not(.pg-ia-no-preview) [data-pg-ia-hide="desktop"] {opacity:0;visibility:hidden;}html:not(.pg-ia-no-preview) [data-pg-ia-show="desktop"] {opacity:1;visibility:visible;display:block;}}';style.innerHTML=pgcss;document.querySelector('head').appendChild(style);}}catch(e){console&&console.log(e);}})()
    </script>

    <body class="background">
        <section class="">
            <div class="container-fluid">
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-4 col-md-4 col-lg-3 col-sm-4">
                        <img src="assets/logo.png" id="logo" class="w-100"/>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
            </div>
        </section>
        <section class="body-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-10 col-lg-5 col-md-5 col-sm-10 ">
                        <h2>enter unique code and vote for your village</h2>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-10 col-lg-5 col-md-5 col-sm-10">
                        <form role="form">
                            <div class="mb-1">
                                <label for="UniqueCode">Unique code*</label>
                                <input type="tel" class="form-control" id="UniqueCode" name="UniqueCode" placeholder="" required="true"/>
                            </div>
                            <div class="mb-1">
                                <label for="District">District*</label>
                                <select id="District" name="District" class="form-control" required="">
                                    <option value="" hidden="">select</option>
                                    <option value="">1</option>
                                    <option value="">2</option>
                                    <option value="">3</option>
                                </select>
                            </div>
                            <div class="mb-1">
                                <label for="Village">Village*</label>
                                <input list="Villages" class="form-control" name="Village" aria-describedby="Village" placeholder="search..." required="true"/>
                                <datalist id="Villages">
                                    <option value="Village1">

                                    <option value="Village2">

                                    <option value="Village3">

                                    <option value="Village4">

                                    <option value="Village5">
                                </datalist>
                            </div>
                            <button type="submit" class="btn btn-primary">submit your vote</button>
                        </form>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
            </div>
        </section>
        <section class="footer">
            <div class="container-fluid footer-area">
                <div class="row">
                    <div class="col col-md col-xl">
</div>
                    <div class="col-12 col-md-12 col-xl-12 col-sm-12">
                        <img src="assets/desktop-ara-line.png" alt="ara-line" class="w-100 mobile-ara"/>
                        <img src="assets/mobile-ara-line.png" alt="ara-line" class="w-100 desktop-ara"/>
                    </div>
                    <div class="col col-md col-xl">
</div>
                </div>
            </div>
        </section>

    ================================================== -->

        <script src="assets/js/popper.min.js"></script>

        <script src="pgia/lib/pgia.js"></script>
    </body>
</html>
